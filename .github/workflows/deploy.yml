name: Deploy Test Backend to VPS

on:
  push:
    branches:
      - test  # Ahora se activa únicamente al empujar a la rama 'test'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Desplegar vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}      # Aquí va tu IP: 109.123.252.124
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Navegar a la nueva carpeta acordada
            cd ~/apps/test-back
            
            # Si la carpeta no está inicializada con Git, clonar la rama test
            if [ ! -d ".git" ]; then
              git clone -b test https://github.com/${{ github.repository }}.git .
            else
              git pull origin test
            fi
            
            # Reconstruir y levantar los contenedores en segundo plano
            docker-compose up -d --build --force-recreate
            
            # Limpieza preventiva de imágenes huérfanas
            docker image prune -f