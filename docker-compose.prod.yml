version: '3.8'

services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      # Nombre de volumen cambiado para que no se mezcle con el de test
      - mariadb_data_prod:/var/lib/mysql
    ports:
      # Puerto 3307 en el host para evitar el choque con el 3306 de test
      - "127.0.0.1:3307:3306"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./static:/app/static
      - ./media:/app/documentos
    ports:
      # Puerto 8001 en el host para evitar colisión con el 8000 de test
      - "127.0.0.1:8001:8000"
    depends_on:
      - db
    env_file:
      - .env

volumes:
  # Definición del nuevo volumen aislado
  mariadb_data_prod: